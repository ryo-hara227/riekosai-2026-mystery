<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" role="img" aria-labelledby="title desc">
  <title id="title">旧校舎地下・設備通信図</title>
  <desc id="desc">中継器間の設備接続。奥の区画は設備図に登録されていない。</desc>
  <rect width="920" height="570" rx="16" fill="#eef6fb"/>
  <rect x="656" y="102" width="226" height="387" rx="12" fill="#fff3d8" stroke="#93713f" stroke-width="3" stroke-dasharray="11 9"/>
  <g fill="none" stroke="#688eaa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M103 157H521L690 309"/><!-- 02 — 05 — 09 -->
    <path d="M103 309H345H690"/><!-- 04 — 07 — 09 -->
    <path d="M103 460H521L690 309"/><!-- 03 — 08 — 09 -->
    <path d="M345 397V460"/><!-- 06 — 08 -->
  </g>
  <path d="M690 309H849" fill="none" stroke="#93713f" stroke-width="5" stroke-dasharray="10 8"/>
  <g font-family="sans-serif" fill="#15364b">
    <text x="36" y="49" font-size="29" font-weight="bold">響ヶ丘学園 旧校舎 B1</text>
    <text x="36" y="79" font-size="20">設備通信図</text>
    <g font-size="21" text-anchor="middle">
      <text x="103" y="119">西階段</text><text x="345" y="119">中央廊下</text>
      <text x="103" y="269">配電室入口</text><text x="345" y="269">中央連絡路</text>
      <text x="103" y="422">搬入口</text><text x="345" y="356">隠し制御室</text>
      <text x="345" y="509">点検通路</text><text x="691" y="373">東側保守通路</text>
      <text x="769" y="160" font-weight="bold">未登録区画</text>
      <text x="769" y="193" font-size="17">部屋・入口の記載なし</text>
    </g>
    <text x="36" y="548" font-size="17">● 中継器　　━ 設備接続　　┄ 区画内の経路は未登録</text>
  </g>
  <g fill="#176080" stroke="#fff" stroke-width="3">
