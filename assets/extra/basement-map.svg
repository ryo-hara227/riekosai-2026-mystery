<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">旧校舎地下・設備通信図（仮図面）</title><desc id="desc">西階段から地下機械室、赤い扉の先の隠し制御室、東側保守通路を経て中継器09へ。中継器09の周辺は未登録区画で正確な部屋と入口は未確定。</desc>
